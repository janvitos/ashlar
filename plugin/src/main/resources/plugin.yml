name: Ashlar
version: ${version}
main: cc.wujm.ashlar.AshlarPlugin
# Minimum supported API. Sources compile against Paper 26.1.2; newer
# Paper 26.2 remains the disposable development server target.
api-version: "26.1"
author: Rcwalter
description: Lets AI assistants (via MCP) survey, render, build, inspect and snapshot a Paper server over a WebSocket RPC bridge.

# Third-party libraries Paper downloads and loads at runtime. Not shaded into
# the plugin jar - keeps the jar small and avoids classloader conflicts.
libraries:
  - org.java-websocket:Java-WebSocket:1.6.0

commands:
  ashlar:
    description: Ask the AI assistant to build or change something near you.
    usage: /ashlar <what you want> | cancel | usage | help
permissions:
  ashlar.use:
    description: Allows using /ashlar.
    default: op
  ashlar.monitor:
    description: Echoes every /ashlar request and final reply from other players.
    default: op
  ashlar.admin:
    description: "Manage the AI assistant: limits, pause/resume, cancelling other players' requests."
    default: op
